# /etc/nginx/conf.d/mast-ns-control.conf
# vi: se terse nows sts=4 sw=4 ts=4:

# Redirect plain HTTP → HTTPS
#
# default_server, so a request that arrives by IP or under a name we do not
# expect is redirected here too. Without it those requests fall through to the
# stock Debian site, which answers 404 for every MAST path -- http://10.23.1.181/
# and http://127.0.0.1/ both did, and the 404 reads exactly like a broken
# reverse proxy. Deploying this therefore requires disabling that site
# (rm /etc/nginx/sites-enabled/default): two default servers on port 80 is a
# duplicate-default-server error and nginx will not start. See root/README.md.
server {
    listen 80 default_server;
    listen 8000 default_server;
    server_name mast-ns-control.weizmann.ac.il mast-ns-control;
    return 301 https://mast-ns-control.weizmann.ac.il$request_uri;
}

server {
    set $proxy_port 443;
    set $proxy_external_ip 10.23.1.181;
    set $proxy_hostname mast-ns-control.weizmann.ac.il;

	if ($host != 'mast-ns-control.weizmann.ac.il') {
		return 301 https://mast-ns-control.weizmann.ac.il$request_uri;
	}

    listen 443 ssl;
    server_name mast-ns-control.weizmann.ac.il mast-ns-control;

    ssl_certificate     /etc/ssl/certs/mast-ns-control.crt;
    ssl_certificate_key /etc/ssl/private/mast-ns-control.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /static/ {
	proxy_pass http://localhost:8010/static/;
    }

    location / {
	return 301 https://mast-ns-control.weizmann.ac.il/mast-dash/;
    }


    # mast-dash (Django GUI)
    location /mast-dash/ {
	proxy_pass http://localhost:8010/;
	proxy_set_header Host $proxy_hostname;
	proxy_set_header X-Forwarded-Host $proxy_hostname;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Proxy-Base /mast-dash/;
	proxy_set_header X-Proxy-Port ${proxy_port};
	proxy_set_header X-Proxy-External-IP ${proxy_external_ip};
	proxy_set_header X-Forwarded-Port ${proxy_port};
    }


    location /mast-backend/ {
        proxy_pass http://localhost:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Base /mast-backend/;
        proxy_set_header X-Proxy-Port ${proxy_port};
        proxy_set_header X-Proxy-External-IP ${proxy_external_ip};
    }

    # wao-safety (the LAST observatory's Grafana, on last0)
    #
    # Proxied to /grafana/ rather than to the upstream root: that Grafana serves
    # from the /grafana/ sub-path and answers a bare / with a 301 to
    # http://10.23.1.25:3000/grafana/ -- an absolute URL that walks the client
    # straight off this host, over plain HTTP, from a page served as HTTPS. The
    # browser blocks it as mixed content and the reverse proxy has bought
    # nothing. Pointing at the sub-path keeps the exchange behind this vhost.
    location /wao-safety/ {
        proxy_pass http://10.23.1.25:3000/grafana/;
        proxy_hide_header X-Frame-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Base /wao-safety/;
        proxy_set_header X-Proxy-Port ${proxy_port};
        proxy_set_header X-Proxy-External-IP ${proxy_external_ip};
    }

    # resources (Grafana dashboards, embedded in iframe)
    location /resources/ {
	proxy_pass http://localhost:3000/grafana/dashboards/;
	proxy_set_header Host $proxy_hostname;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
    }

	# Grafana (local, sub-pathed at /grafana/)
	location /grafana/ {
		proxy_pass http://localhost:3000/grafana/;
		proxy_set_header Host $proxy_hostname;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_hide_header X-Frame-Options;
	}


    # mast-share (File System Service)
    location /mast-share/ {
        proxy_pass http://localhost:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Base /mast-share/;
        proxy_set_header X-Proxy-Port ${proxy_port};
        proxy_set_header X-Proxy-External-IP ${proxy_external_ip};
    }
}
