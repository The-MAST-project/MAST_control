# /etc/nginx/stream.d/last0-smb.conf
# vi: se terse nows sts=4 sw=4 ts=4:

# Tunnel SMB to last0 (10.23.1.25).
#
# Raw TCP, so this is a `stream` block, not `http`. It cannot live in conf.d/, which
# nginx.conf includes inside http { }. nginx.conf must include this directory at the
# top level, outside http { }:
#
#     include /etc/nginx/stream.d/*.conf;
#
# and the stream module must be loaded: `apt install libnginx-mod-stream` puts a
# load_module snippet in /etc/nginx/modules-enabled/. See root/README.md.
#
# Port 4445, not 445: this host's own smbd holds 445 and 139 (the mast-share share).
# macOS and Linux clients can name the port (smb://mast-ns-control:4445/<share>).
# Windows cannot without `netsh interface portproxy`.
#
# No allow/deny, by decision: anyone who can reach this port reaches last0's SMB login.
# nginx cannot see inside SMB, so authentication is last0's alone.
stream {
    server {
        listen 4445;
        proxy_pass 10.23.1.25:445;
    }
}
