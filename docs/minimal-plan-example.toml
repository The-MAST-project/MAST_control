# =============================================================================
# MAST plan -- the minimal example
# =============================================================================
# A plan file is named PLAN_<ULID>.toml; one submitted through MAST_control gets its ULID
# there. Only what has no default is written here. Every other field, with its default and
# what it allows, is in full-plan-example.toml.
#
# With no spectrograph `instrument` -- as here, with no [spec] at all -- the plan only
# acquires: the units acquire the target and guide on it, and no spectrum is taken. That is
# the plan control generates for `start_acquisition`.

# The units to observe with: unit specifiers, or the word "any".
#   "mast01"      one unit, by name
#   "ns:1,3,5"    units 1, 3 and 5 at site ns
#   "ns:10-17"    a range of units at site ns
#   "ns:north:2"  the 2nd unit of building north at site ns
#   "any"         every unit deployed and not in maintenance
requested_units = ["mast01", "mast03"]

# What to observe, in J2000.
[target]

# Right ascension: sexagesimal hours "HH:MM:SS.s" (colon- or space-separated), or decimal
# hours. 0 <= RA < 24.
ra_hours = "03:19:48.16"

# Declination: sexagesimal degrees "+DD:MM:SS.s" (colon- or space-separated), or decimal
# degrees. -90 to +90.
dec_degrees = "+41:30:42.1"

# Or the target's name alone, in place of the two coordinates: it is resolved once, when the
# plan is submitted (TNS, then SIMBAD/NED/VizieR through Sesame), and stored with the
# coordinates it resolved to. With both coordinates given, the name is only a label.
# name = "NGC 1275"
