# =============================================================================
# MAST plan -- every field
# =============================================================================
# A plan file is named PLAN_<ULID>.toml. Each field is described above it. A field that has a
# default is commented out, showing its default and what it allows: uncomment it only to
# change it. A table whose fields are all commented out is commented out with them -- a plan
# file carries no empty tables. The minimal plan is in minimal-plan-example.toml.


# --- The plan ----------------------------------------------------------------

# The plan's id. Taken from the file name, PLAN_<ULID>.toml, which wins if they differ; a file
# whose name carries none gets a new one. Leave it out.
# ulid = "01JAD8Q4ZK7V3M2XG9T6R5N0HB"

# Who submitted the plan: a user id, filled in by the web interface.
# owner = "jdoe"

# The plan's scientific priority. 1 (lowest) to 10 (highest).
# merit = 1

# Target of Opportunity: may pre-empt the plan in progress. true | false. Plan managers only.
# too = false

# Approved for execution: set by a plan manager, never in the file by hand. true | false.
# approved = false

# A production plan: false relaxes the availability checks, for testing only. true | false.
# production = true

# A mockup: scheduled, never executed. For testing the scheduler. true | false.
# mockup = false


# --- Units ---------------------------------------------------------------------

# The units to observe with: unit specifiers, or the word "any". Required; never empty.
#   "mast01"      one unit, by name
#   "ns:1,3,5"    units 1, 3 and 5 at site ns
#   "ns:10-17"    a range of units at site ns
#   "ns:north:2"  the 2nd unit of building north at site ns
#   "any"         every unit deployed and not in maintenance (then also give `quorum`)
requested_units = ["mast01", "mast03", "mast05"]

# The fewest units the plan needs to continue. It does not start with fewer eligible units;
# it succeeds once this many are guiding; and it is aborted as soon as fewer remain -- units
# failing on their way to guiding, or dropping out of guiding during the exposure.
# 1 <= quorum <= the number of units requested.
# quorum = 1

# The units the scheduler chose, from those requested. Filled in by the scheduler; leave it
# out. Empty until it chooses, and the plan runs on what it requested.
# scheduled_units = []

# Seconds each unit has, from the start of its acquisition, to lock on a star. A unit that
# has not is aborted and fails. 0 < seconds <= 600.
# timeout_to_guiding = 600.0

# Focus each unit on a star near the target before acquiring it (focus_on_star). true | false.
# autofocus = false


# --- The target ----------------------------------------------------------------

# What to observe, in J2000. Required.
[target]

# Right ascension: sexagesimal hours "HH:MM:SS.s" (colon- or space-separated), or decimal
# hours. 0 <= RA < 24. Required, unless `name` is given instead.
ra_hours = "03:19:48.16"

# Declination: sexagesimal degrees "+DD:MM:SS.s" (colon- or space-separated), or decimal
# degrees. -90 to +90. Required, unless `name` is given instead.
dec_degrees = "+41:30:42.1"

# The target's name. With both coordinates given, a label. Without them, it is resolved once,
# when the plan is submitted (TNS, then SIMBAD/NED/VizieR through Sesame), and the plan is
# stored with the coordinates it resolved to and a "resolved" event. A name that does not
# resolve refuses the plan.
# name = "NGC 1275"

# The target's visual magnitude. For information.
# magnitude = 11.9

# The science this plan is for. Free text, for organising the data.
# [target.science]

# The science case, e.g. "Spectroscopy", "Radial velocity monitoring".
# case = "Spectroscopy"

# The target's classification, e.g. "AGN", "Star", "SN", "WD Binary RV".
# classification = "AGN"


# --- The spectrograph ------------------------------------------------------------
# A plan with no spectrograph `instrument` -- this table left out, or written without one --
# only acquires: the units acquire the target and guide on it, no spectrum is taken, and the
# plan completes once `quorum` units are guiding. That is the plan control generates for
# `start_acquisition`. With an `instrument`, the spectrograph exposes once `quorum` units are
# guiding, and the plan completes when the exposure series does.

# [spec]

# Which spectrograph: "highspec" | "deepspec". None, the default: no spectrum, the plan only
# acquires.
# instrument = "highspec"

# Seconds per exposure. Required with an `instrument`. 0 < seconds <= 3600.
# requested_exposure_duration = 1800.0

# Exposures in the series. >= 1.
# requested_number_of_exposures = 1

# The longest single exposure this plan accepts, in seconds: a plan is not batched with
# others exposing longer. 0 < seconds <= 3600; none for no limit.
# max_exposure_duration = 600.0

# Calibration: the ThAr lamp.
# [spec.calibration]

# Light the ThAr lamp during the exposure. true | false.
# lamp_on = false

# The ThAr filter, required with the lamp on: one of the site's ThAr filters (the web
# interface offers them), e.g. "ND1000", "ND3000".
# filter = "ND3000"

# When the exposure series is scheduled again.
# [spec.repeats]

# How often per night. "Only once" | "Once per night" | "Twice per night" | "As much as possible".
# every = "Only once"

# For how many nights. 1 to 100.
# nights = 1

# The instrument's own settings. Not shown in the web interface; leave them out unless the
# instrument's engineer says otherwise. For deepspec, `camera` is a table per band.
# [spec.settings]

# Highspec's disperser. Required in these settings. "Ca" | "Mg" | "Halpha" | "Empty".
# disperser = "Halpha"

# Highspec's camera (Newton).
# [spec.settings.camera]

# Seconds per frame.
# exposure_duration = 5.0

# Frames per exposure.
# number_of_exposures = 1

# The Andor acquisition mode.
# acquisition_mode = 1

# "conventional" | "em".
# amplifier_mode = "conventional"

# EM gain, with amplifier_mode = "em".
# em_gain = 254

# Pre-amplifier gain index.
# pre_amp_gain = 0

# Horizontal shift speed. "3.0 MHz" | "1.0 MHz" | "0.05 MHz".
# horizontal_shift_speed = "0.05 MHz"

# Whether the camera takes part. true | false.
# camera_enabled = true

# Binning. Each >= 1.
# [spec.settings.camera.binning]
# x = 1
# y = 1

# Cooling, in degrees C.
# [spec.settings.camera.temperature]
# regular_set_point = -10
# science_set_point = -85
# cooler_mode = 0


# --- Constraints ---------------------------------------------------------------
# When the plan may be observed. Each table is optional; leave out what does not matter.

# The Moon.
# [constraints.moon]

# The brightest Moon allowed, in percent illuminated. 0 (new) to 100 (full).
# max_phase = 50.0

# The closest the Moon may be, in degrees. 0 to 180.
# min_distance = 30.0

# Airmass.
# [constraints.airmass]

# The highest airmass allowed. 1.0 (zenith) to 3.0.
# max = 2.0

# Seeing.
# [constraints.seeing]

# The worst seeing allowed, in arcsec. 0 to 5.0.
# max = 2.0

# The time window the plan may run in.
# [constraints.time_window]

# When the window opens. "Anytime" | "Date" | "DateTime".
# start_mode = "Anytime"

# The opening date (start_mode = "Date") or UTC date and time ("DateTime").
# start = 2026-11-01

# When the window closes. "Anytime" | "Date" | "DateTime" | "After" (end_after_nights).
# end_mode = "Anytime"

# The closing date (end_mode = "Date") or UTC date and time ("DateTime").
# end = 2026-11-30

# With end_mode = "After": the window closes after this many nights. 1 to 100.
# end_after_nights = 7


# --- Events ----------------------------------------------------------------------
# The plan's log, appended by MAST_control as things happen: submitted, resolved, executing,
# each unit's progress, completed / failed / aborted. Never written by hand.
# [[events]]
# what = "submitted"
# details = []
# when = "2026-10-25T12:00:00+00:00"
